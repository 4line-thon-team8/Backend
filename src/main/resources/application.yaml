spring:
  application:
    name: backend
  config:
    # 프로젝트 루트의 .env 파일이 있으면 읽는다. 없어도 에러 없이 넘어간다.
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fivegrade}
    username: ${DB_USER:fivegrade}
    # 비밀번호는 기본값을 두지 않는다. .env 또는 환경 변수로 반드시 넣는다.
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # 테이블은 JPA가 아니라 Flyway 마이그레이션이 만든다. JPA는 검증만 한다.
      ddl-auto: validate
    # 화면(응답) 단계에서 DB 조회가 일어나는 것을 막는다.
    open-in-view: false
  flyway:
    enabled: true
  jackson:
    mapper:
      # "2" 같은 문자열을 숫자나 불리언으로 조용히 바꿔 받지 않는다.
      # 성적은 숫자만 받기로 했는데 문자열이 통과하면, 클라이언트 버그가 서버에서 가려진다.
      allow-coercion-of-scalars: false
    deserialization:
      # 정의하지 않은 필드는 조용히 무시하지 않고 400 으로 거부한다.
      # 받지 않기로 한 필드(gradeSystem, credits 등)를 보낸 클라이언트가 값이 반영된 줄 알고 넘어가는 것을 막는다.
      fail-on-unknown-properties: true
      # 2.9 같은 소수를 정수로 잘라(2) 받지 않는다. 등급은 정수만 허용한다.
      accept-float-as-int: false

# OpenAPI 문서(/v3/api-docs)와 Swagger UI(/swagger-ui.html).
# 운영 서버에서 문서가 실수로 열리지 않도록 기본값은 꺼짐이다. 로컬 개발에서만 .env 로 켠다.
springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:false}
